<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Megal ERP - Vercel Postgres</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#0f172a;color:#e2e8f0;height:100vh;display:flex;overflow:hidden}
.erp-sidebar{width:260px;background:#111827;border-right:1px solid #1f2937;padding:18px;display:flex;flex-direction:column;gap:8px}
.tab{padding:10px 14px;border-radius:8px;cursor:pointer;background:#1f2937;color:#94a3b8;font-size:13px;border:none;text-align:left}
.tab.active{background:#0ea5e9;color:white}
.main{flex:1;overflow:auto;padding:16px;background:#0f172a}
.card{background:#1e293b;border-radius:12px;padding:16px;border:1px solid #2d3748;margin-bottom:16px}
.hidden{display:none!important}
.view-section{display:block}
</style>
</head>
<body>
<div class="erp-sidebar">
<h1 style="color:#38bdf8;margin-bottom:12px">🔥 Megal ERP</h1>
<button class="tab active" onclick="mostrarSeccion('resumen',this)">📊 Resumen</button>
<button class="tab" onclick="mostrarSeccion('gps',this)">📍 GPS</button>
<button class="tab" onclick="mostrarSeccion('repartidores',this)">🛵 Repartidores</button>
<button class="tab" onclick="mostrarSeccion('productos',this)">📦 Productos</button>
<button class="tab" onclick="mostrarSeccion('clientes',this)">👥 Clientes</button>
<button class="tab" onclick="mostrarSeccion('proveedores',this)">🏭 Proveedores</button>
<button class="tab" onclick="mostrarSeccion('stock',this)">📦 Stock</button>
<button class="tab" onclick="mostrarSeccion('ventas',this)">💰 Ventas</button>
<div id="headerStatus" style="margin-top:auto;font-size:11px;color:#22c55e">● Conectado Postgres</div>
</div>
<div class="main">
<div id="view-resumen" class="view-section"><div class="card"><h3>Resumen - Rocha</h3><p style="font-size:12px;color:#94a3b8">Base OK. API: /api/postgres</p></div></div>
<div id="view-gps" class="view-section hidden"><div class="card">Módulo GPS - próximo paso</div></div>
<div id="view-repartidores" class="view-section hidden"><div class="card">Módulo Repartidores - próximo</div></div>
<div id="view-productos" class="view-section hidden"><div class="card">Módulo Productos - próximo</div></div>
<div id="view-clientes" class="view-section hidden"><div class="card">Módulo Clientes - próximo</div></div>
<div id="view-proveedores" class="view-section hidden"><div class="card">Módulo Proveedores - próximo</div></div>
<div id="view-stock" class="view-section hidden"><div class="card">Módulo Stock - próximo</div></div>
<div id="view-ventas" class="view-section hidden"><div class="card">Módulo Ventas - próximo</div></div>
</div>
<script>
const API='/api/postgres';
function mostrarSeccion(id,btn){
 document.querySelectorAll('.view-section').forEach(s=>s.classList.add('hidden'));
 const el=document.getElementById('view-'+id); if(el) el.classList.remove('hidden');
 document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
 if(btn) btn.classList.add('active');
}
</script>
</body>
</html>
