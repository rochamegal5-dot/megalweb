<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Megal ERP - Vercel Postgres FIX</title>

<!-- Leaflet GPS - TIENE QUE ESTAR EN EL HEAD -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#0f172a;color:#e2e8f0;height:100vh;display:flex;overflow:hidden}
.erp-sidebar{width:260px;background:#111827;border-right:1px solid #1f2937;padding:18px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.tab{padding:10px 14px;border-radius:8px;cursor:pointer;background:#1f2937;color:#94a3b8;font-size:13px;border:none;text-align:left}
.tab.active{background:#0ea5e9;color:white}
.main{flex:1;overflow:auto;padding:16px;background:#0f172a}
.card{background:#1e293b;border-radius:12px;padding:16px;border:1px solid #2d3748;margin-bottom:16px}
.hidden{display:none!important}
.view-section{display:block}
input,select{padding:10px;background:#1e293b;border:1px solid #334155;color:white;border-radius:8px}
#gpsMap,#gpsMapHist{height:500px;width:100%;border-radius:12px}
table{width:100%;font-size:12px;border-collapse:collapse}
th,td{padding:6px;border:1px solid #1f2937;text-align:left}
</style>
</head>
<body>
<div class="erp-sidebar">
<h1 style="color:#38bdf8;margin-bottom:12px">🔥 Megal ERP</h1>
<button class="tab active" onclick="mostrarSeccion('resumen',this)">📊 Resumen</button>
<button class="tab" onclick="mostrarSeccion('gps',this)">📍 GPS</button>
<button class="tab" onclick="mostrarSeccion('repartidores',this)">🛵 Repartidores</button>
<button class="tab" onclick="mostrarSeccion('productos',this)">📦 Productos</button>
<button class="tab" onclick="mostrarSeccion('clientes',this)">👥 Clientes</button>
<button class="tab" onclick="mostrarSeccion('proveedores',this)">🏭 Proveedores</button>
<button class="tab" onclick="mostrarSeccion('stock',this)">📦 Stock</button>
<button class="tab" onclick="mostrarSeccion('ventas',this)">💰 Ventas</button>
<button class="tab" onclick="mostrarSeccion('finanzas',this)">📊 Finanzas</button>
<div id="headerStatus" style="margin-top:auto;font-size:11px;color:#22c55e">● Conectado Postgres</div>
</div>

<div class="main">
<!-- RESUMEN -->
<div id="view-resumen" class="view-section">
  <div class="card">
    <h3 style="font-weight:900">📊 Resumen - Rocha</h3>
    <p style="font-size:11px;color:#94a3b8">Megal Gas - Base Postgres Neon</p>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px">
      <div class="card" style="margin:0;text-align:center"><p style="font-size:10px;color:#94a3b8">VENTAS HOY</p><b id="resVentasHoy" style="font-size:20px;color:#22c55e">$0</b><p style="font-size:10px" id="resVentasCount">0 ventas</p></div>
      <div class="card" style="margin:0;text-align:center"><p style="font-size:10px;color:#94a3b8">STOCK LLENAS</p><b id="resStockTotal" style="font-size:20px">0</b><p style="font-size:10px" id="resStockDetalle">11:0 | 13:0 | 45:0</p></div>
      <div class="card" style="margin:0;text-align:center"><p style="font-size:10px;color:#94a3b8">BALANCE CAJA</p><b id="resCajaHoy" style="font-size:20px">$0</b><p style="font-size:10px;color:#38bdf8" id="resFletesHoy">Fletes $0</p></div>
    </div>
    <div class="card" style="margin-top:12px"><h4>📋 Últimas Ventas</h4><div id="resUltimasVentas" style="font-size:11px;margin-top:8px">Cargando...</div></div>
  </div>
</div>

<!-- GPS -->
<div id="view-gps" class="view-section hidden">
  <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    <h3 style="font-weight:900">📍 GPS - Flota Rocha</h3>
    <div style="display:flex;gap:6px">
      <button id="btnGpsVivo" onclick="cambiarTabGps('vivo')" style="padding:8px 12px;background:#0ea5e9;color:white;border:none;border-radius:8px;font-weight:900">VIVO</button>
<button id="btnGpsHist" onclick="cambiarTabGps('historico')" style="padding:8px 12px;background:#1f2937;color:#94a3b8;border:1px solid #334155;border-radius:8px">HISTÓRICO</button>
  </div>
  </div>
  <div id="gpsVivoTab">
    <div class="card" style="padding:8px"><div id="gpsMap" style="height:500px;width:100%;border-radius:12px"></div></div>
  </div>
  <div id="gpsHistTab" class="hidden">
    <div class="card" style="padding:8px"><div id="gpsMapHist" style="height:500px;width:100%;border-radius:12px"></div></div>
  </div>
</div>  

  <script>
// ================= PRINCIPIO DEL SCRIPT - NO BORRAR =================
const API='/api/postgres';
let gpsMap=null,gpsMapHist=null,gpsPoll=null,tubo43Cache=null;
let finanzasCache=[],provCache=[],repCache=[],clientesCache=[];

function mostrarSeccion(id,btn){
  document.querySelectorAll('.view-section').forEach(s=>s.classList.add('hidden'));
  const el=document.getElementById('view-'+id);
  if(el) el.classList.remove('hidden');
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  if(id==='resumen') cargarResumen();
  if(id==='stock'){ cargarStock(); cambiarTabStock('gas'); }
  if(id==='finanzas') cargarFinanzas();
  if(id==='gps'){ setTimeout(()=>{initGpsMaps(); cargarGpsVivo();},150); }
  if(id==='productos') cargarProductosCatalogo();
  if(id==='clientes') cargarClientes();
  if(id==='proveedores') cargarProveedores();
  if(id==='repartidores') cargarRepartidores();
  if(id==='ventas'){ cambiarTabVentas('mostrador'); }
}
// ================= FIN PRINCIPIO =================

// ================= AQUÍ VAN TUS MÓDULOS =================

async function cargarResumen(){
 try{
  const hoy=new Date().toISOString().split('T')[0];
  const rV=await fetch(API+'?table=ventas',{cache:'no-store'}); 
  const jV=await rV.json(); 
  const ventas=(jV.data||[]);
  const ventasHoy=ventas.filter(v=> (v.fecha||'').toString().split('T')[0]===hoy);
  const totHoy=ventasHoy.reduce((s,v)=>s+(parseFloat(v.total)||0),0);
  const fleteHoy=ventasHoy.reduce((s,v)=>s+(parseFloat(v.flete)||0),0);
  document.getElementById('resVentasHoy').textContent='$'+totHoy;
  document.getElementById('resVentasCount').textContent=ventasHoy.length+' ventas';
  document.getElementById('resCajaHoy').textContent='$'+totHoy;
  document.getElementById('resFletesHoy').textContent='Fletes $'+fleteHoy;
  
  const rD=await fetch(API+'?table=deposito',{cache:'no-store'}); 
  const jD=await rD.json(); 
  const dep=jD.data||[];
  const totLlenas=dep.reduce((s,d)=>s+(parseInt(d.llenas)||0),0);
  const d11=dep.find(d=>String(d.producto_id)==='11'); 
  const d13=dep.find(d=>String(d.producto_id)==='13'); 
  const d45=dep.find(d=>String(d.producto_id)==='45');
  document.getElementById('resStockTotal').textContent=totLlenas+' llenas';
  document.getElementById('resStockDetalle').textContent='11:'+(d11?.llenas||0)+' | 13:'+(d13?.llenas||0)+' | 45:'+(d45?.llenas||0);
  let h=''; 
  ventas.slice(0,5).forEach(v=>{ 
    h+='<div style="display:flex;justify-content:space-between;padding:6px;background:#0f172a;border-radius:6px;margin-bottom:4px"><span>'+(v.fecha||'').substring(11,16)+' '+(v.cliente_nombre||'')+' '+v.producto_id+'</span><b>$'+v.total+'</b></div>'; 
  });
  document.getElementById('resUltimasVentas').innerHTML=h||'Sin ventas';
 }catch(e){ console.log('resumen error',e); }
}
function cambiarTabGps(t){
  const vivo = document.getElementById('gpsVivoTab');
  const hist = document.getElementById('gpsHistTab');
  if(t==='vivo'){
    vivo.classList.remove('hidden');
    hist.classList.add('hidden');
  } else {
    hist.classList.remove('hidden');
    vivo.classList.add('hidden');
  }
  // fuerza a leaflet a recalcular el tamaño después de mostrar
  setTimeout(()=>{
    if(t==='vivo' && gpsMap){ gpsMap.invalidateSize(); }
    if(t==='historico' && gpsMapHist){ gpsMapHist.invalidateSize(); }
  },250);
}

function initGpsMaps(){
  try{
    if(!gpsMap){
      gpsMap=L.map('gpsMap').setView([-34.48,-54.33],13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(gpsMap);
    }
    if(!gpsMapHist){
      gpsMapHist=L.map('gpsMapHist').setView([-34.48,-54.33],13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(gpsMapHist);
    }
    setTimeout(()=>{if(gpsMap) gpsMap.invalidateSize(); if(gpsMapHist) gpsMapHist.invalidateSize();},300);
  }catch(e){ console.log('gps init',e); }
}

async function cargarGpsVivo(){
  try{
    const r=await fetch(API+'?table=gps_locations',{cache:'no-store'});
    const j=await r.json();
    const pts=j.data||[];
    if(gpsMap){
      gpsMap.eachLayer(l=>{if(l instanceof L.Marker) gpsMap.removeLayer(l);});
      pts.slice(0,30).forEach(p=>{
        const lat=parseFloat(p.lat||p.latitude);
        const lng=parseFloat(p.lng||p.longitude);
        if(!lat||!lng) return;
        L.marker([lat,lng]).addTo(gpsMap).bindPopup((p.repartidor||'')+' '+(p.fecha||'').substring(11,19));
      });
      if(pts[0]){
        const la=parseFloat(pts[0].lat||pts[0].latitude);
        const ln=parseFloat(pts[0].lng||pts[0].longitude);
        if(la&&ln) gpsMap.setView([la,ln],14);
      }
    }
    if(gpsPoll) clearInterval(gpsPoll);
    gpsPoll=setInterval(cargarGpsVivo,7000);
  }catch(e){ console.log('gps vivo',e); }
}
// Ej: cargarResumen(), cargarStock(), etc.
// Los vas pegando uno abajo del otro

// ================= FINAL DEL SCRIPT - NO BORRAR =================
document.addEventListener('DOMContentLoaded',()=>{
  const hoy=new Date().toISOString().split('T')[0];
  const f=document.getElementById('finFecha');
  if(f) f.value=hoy;
  cargarResumen();
  const a=document.getElementById('ventaTipoCliente');
  if(a) actualizarReglaFlete();
  const b=document.getElementById('ventaProducto');
  if(b) calcularTotalMostrador();
});
// ================= FIN SCRIPT =================
</script>
</body>
</html>
