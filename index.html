<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MegalWeb GPS - Turso</title>
<style>
  body { font-family: system-ui; background: #0f172a; color: white; padding: 20px; max-width: 800px; margin: auto; }
  button { background: #22c55e; color: white; border: 0; padding: 12px 20px; border-radius: 8px; cursor: pointer; margin: 5px; font-weight: bold; }
  button.secondary { background: #3b82f6; }
  button.dark { background: #334155; }
  #status { background: #1e293b; padding: 15px; border-radius: 8px; margin: 15px 0; min-height: 20px; }
  #lista { background: #1e293b; padding: 15px; border-radius: 8px; max-height: 400px; overflow: auto; }
  .item { border-bottom: 1px solid #334155; padding: 8px 0; font-size: 13px; }
</style>
</head>
<body>

<h1>📍 MegalWeb GPS - Turso sin límite</h1>

<div id="status">Listo para probar...</div>

<button onclick="probarConexionSegura()">🔌 Probar Conexión Segura</button>
<button class="secondary" onclick="obtenerUbicacionReal()">🌎 Mi Ubicación Real</button>
<button class="dark" onclick="verHistorial()">📋 Ver Historial Completo</button>

<h3>Historial (Turso)</h3>
<div id="lista">Sin datos...</div>

<script>
// FUNCION QUE FALTABA - Ahora sí definida
async function actualizarUbicacion(lat, lng, device_id = 7) {
  try {
    document.getElementById('status').innerText = `Enviando ${lat}, ${lng}...`;
    const res = await fetch(`/api/gps?lat=${lat}&lng=${lng}&device_id=${device_id}`);
    const json = await res.json();
    console.log(json);
    if(json.ok) {
      document.getElementById('status').innerText = `✅ Guardado: ${lat}, ${lng} | Total en DB: ${json.total}`;
      verHistorial();
    } else {
      document.getElementById('status').innerText = `❌ Error: ${json.error}`;
    }
    return json;
  } catch(e) {
    document.getElementById('status').innerText = `❌ Error: ${e.message}`;
    console.error(e);
  }
}

async function probarConexionSegura() {
  const lat = -34.903 + (Math.random()-0.5)/100;
  const lng = -56.188 + (Math.random()-0.5)/100;
  await actualizarUbicacion(lat, lng, 7);
}

function obtenerUbicacionReal() {
  if(!navigator.geolocation) {
    document.getElementById('status').innerText = 'GPS no soportado, usando test';
    return probarConexionSegura();
  }
  document.getElementById('status').innerText = 'Obteniendo GPS...';
  navigator.geolocation.getCurrentPosition(
    pos => actualizarUbicacion(pos.coords.latitude, pos.coords.longitude, 7),
    err => {
      document.getElementById('status').innerText = 'Error GPS: ' + err.message + ' - usando test';
      probarConexionSegura();
    }
  );
}

async function verHistorial() {
  try {
    const res = await fetch('/api/gps?all=1');
    const json = await res.json();
    if(json.data && json.data.length > 0) {
      document.getElementById('lista').innerHTML = json.data.map(d => `
        <div class="item">
          <b>ID ${d.device_id}</b> - ${d.lat}, ${d.lng}<br>
          <small>${d.recorded_at}</small>
        </div>
      `).join('');
    } else {
      document.getElementById('lista').innerText = 'Sin datos aún. Probá conexión.';
    }
  } catch(e) {
    document.getElementById('lista').innerText = 'Error: ' + e.message;
  }
}

// Cargar historial al abrir
verHistorial();
</script>

</body>
</html>
