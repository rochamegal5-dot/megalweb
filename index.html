<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Megal ERP - Vercel Postgres</title>

<!-- Leaflet GPS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#0f172a;color:#e2e8f0;height:100vh;display:flex;overflow:hidden}
.erp-sidebar{width:260px;background:#111827;border-right:1px solid #1f2937;padding:18px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.tab{padding:10px 14px;border-radius:8px;cursor:pointer;background:#1f2937;color:#94a3b8;font-size:13px;border:none;text-align:left}
.tab.active{background:#0ea5e9;color:white}
.main{flex:1;overflow:auto;padding:16px;background:#0f172a}
.card{background:#1e293b;border-radius:12px;padding:16px;border:1px solid #2d3748;margin-bottom:16px}
.hidden{display:none!important}
.view-section{display:block}
input,select{padding:10px;background:#1e293b;border:1px solid #334155;color:white;border-radius:8px}
#gpsMap,#gpsMapHist{height:500px;width:100%;border-radius:12px}
table{width:100%;font-size:12px;border-collapse:collapse}
th,td{padding:6px;border:1px solid #1f2937;text-align:left}
</style>
</head>
<body>
<div class="erp-sidebar">
<h1 style="color:#38bdf8;margin-bottom:12px">🔥 Megal ERP</h1>
<button class="tab active" onclick="mostrarSeccion('resumen',this)">📊 Resumen</button>
<button class="tab" onclick="mostrarSeccion('gps',this)">📍 GPS</button>
<button class="tab" onclick="mostrarSeccion('repartidores',this)">🛵 Repartidores</button>
<button class="tab" onclick="mostrarSeccion('productos',this)">📦 Productos</button>
<button class="tab" onclick="mostrarSeccion('clientes',this)">👥 Clientes</button>
<button class="tab" onclick="mostrarSeccion('proveedores',this)">🏭 Proveedores</button>
<button class="tab" onclick="mostrarSeccion('stock',this)">📦 Stock</button>
<button class="tab" onclick="mostrarSeccion('ventas',this)">💰 Ventas</button>
<button class="tab" onclick="mostrarSeccion('finanzas',this)">📊 Finanzas</button>
<div id="headerStatus" style="margin-top:auto;font-size:11px;color:#22c55e">● Conectado Postgres</div>
</div>

<div class="main">
<div id="view-resumen" class="view-section"><div class="card"><h3>Resumen - Rocha</h3><p style="font-size:12px;color:#94a3b8">Base OK. API: /api/postgres</p></div></div>

<div id="view-gps" class="view-section hidden">
  <!-- GPS aquí -->
  <div id="gpsVivoTab"><div class="card" style="padding:8px"><div id="gpsMap"></div></div></div>
  <div id="gpsHistTab" class="hidden"><div class="card" style="padding:8px"><div id="gpsMapHist"></div></div></div>
</div>

<div id="view-repartidores" class="view-section hidden"><div class="card"><h3>🛵 Repartidores</h3></div><div class="card"><table><tbody id="tablaRepartidores"></tbody></table></div></div>

<div id="view-productos" class="view-section hidden"><div class="card"><h3>📦 Productos</h3></div><div class="card"><table><tbody id="tablaProductos"></tbody></table></div></div>

<div id="view-clientes" class="view-section hidden"><div class="card"><h3>👥 Clientes</h3></div><div class="card"><table><tbody id="tablaClientes"></tbody></table></div></div>

<div id="view-proveedores" class="view-section hidden"><div class="card"><h3>🏭 Proveedores</h3></div><div class="card"><table><tbody id="tablaProveedores"></tbody></table></div></div>

<div id="view-stock" class="view-section hidden">
  <div class="card" style="display:flex;justify-content:space-between;align-items:center">
    <h3 style="font-weight:900">📦 Stock - Depósito</h3>
    <button onclick="abrirBalanceInicial()" style="background:#f59e0b;color:#000;padding:8px 12px;border:none;border-radius:8px;font-weight:900">📝 Balance</button>
  </div>
  
  <!-- PESTAÑAS ESTILO GOOGLE -->
  <div style="display:flex;gap:6px;margin-bottom:12px;background:#111827;padding:6px;border-radius:10px">
    <button id="tabStockGas" onclick="cambiarTabStock('gas')" style="flex:1;padding:10px;background:#0ea5e9;color:white;font-weight:900;border:none;border-radius:8px">🔥 GAS (11,13,45)</button>
    <button id="tabStock43" onclick="cambiarTabStock('tubo43')" style="flex:1;padding:10px;background:#1f2937;color:#94a3b8;border:1px solid #334155;border-radius:8px">🧪 TUBO 43.5</button>
    <button id="tabStockOtros" onclick="cambiarTabStock('otros')" style="flex:1;padding:10px;background:#1f2937;color:#94a3b8;border:1px solid #334155;border-radius:8px">🔧 OTROS</button>
    <button id="tabStockIngreso" onclick="cambiarTabStock('ingreso')" style="flex:1;padding:10px;background:#1f2937;color:#94a3b8;border:1px solid #334155;border-radius:8px">🚚 INGRESO</button>
  </div>

  <div id="stockTabGas"><div id="stockContentGas"></div></div>
  <div id="stockTab43" class="hidden"><div id="stockContent43"></div></div>
  <div id="stockTabOtros" class="hidden"><div id="stockContentOtros"></div></div>
  <div id="stockTabIngreso" class="hidden">
    <div class="card"><h4>🚚 Ingreso Mercadería - Camión Proveedor</h4>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px">
        <select id="ingProducto"><option value="11">11kg</option><option value="13">13kg</option><option value="45">45kg</option><option value="43.5">43.5kg</option></select>
        <input id="ingLlenas" type="number" placeholder="Llenas que trae">
        <input id="ingVacias" type="number" placeholder="Vacías que se lleva">
      </div>
      <input id="ingRemito" placeholder="N° Remito" style="width:100%;margin-top:8px">
      <button onclick="guardarIngresoGas()" style="width:100%;margin-top:10px;padding:12px;background:#22c55e;color:#000;font-weight:900;border:none;border-radius:8px">✅ Guardar Ingreso</button>
    </div>
  </div>
</div>

<div id="view-ventas" class="view-section hidden">
  <div class="card"><h3>💰 Ventas Mostrador</h3><div id="ventasHoyTabla"></div></div>
</div> <!-- IMPORTANTE: ESTE CIERRE ES EL QUE TE FALTABA -->

<div id="view-finanzas" class="view-section hidden">
  <div class="card"><h3>📊 Finanzas</h3><div id="tablaFinanzas"></div></div>
</div>

</div> <!-- cierra main -->

<!-- MODALES FUERA DEL MAIN -->
<div id="modalFinanza" class="hidden" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center">...</div>
<script>
const API='/api/postgres';
let gpsMap=null, gpsPoll=null;

function mostrarSeccion(id,btn){
  document.querySelectorAll('.view-section').forEach(s=>s.classList.add('hidden'));
  var el=document.getElementById('view-'+id);
  if(el) el.classList.remove('hidden');
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  if(id==='stock') cargarStock();
  if(id==='finanzas') cargarFinanzas();
  if(id==='gps'){ initGpsMaps(); cargarGpsVivo(); }
}
function cambiarTabStock(tab){
  document.getElementById('stockTabGas').classList.add('hidden');
  document.getElementById('stockTab43').classList.add('hidden');
  document.getElementById('stockTabOtros').classList.add('hidden');
  document.getElementById('stockTabIngreso').classList.add('hidden');
  document.getElementById('tabStockGas').style.background='#1f2937';
  document.getElementById('tabStock43').style.background='#1f2937';
  document.getElementById('tabStockOtros').style.background='#1f2937';
  document.getElementById('tabStockIngreso').style.background='#1f2937';
  
  if(tab==='gas'){ document.getElementById('stockTabGas').classList.remove('hidden'); document.getElementById('tabStockGas').style.background='#0ea5e9'; }
  if(tab==='tubo43'){ document.getElementById('stockTab43').classList.remove('hidden'); document.getElementById('tabStock43').style.background='#f59e0b'; document.getElementById('tabStock43').style.color='#000'; }
  if(tab==='otros'){ document.getElementById('stockTabOtros').classList.remove('hidden'); document.getElementById('tabStockOtros').style.background='#0ea5e9'; }
  if(tab==='ingreso'){ document.getElementById('stockTabIngreso').classList.remove('hidden'); document.getElementById('tabStockIngreso').style.background='#22c55e'; document.getElementById('tabStockIngreso').style.color='#000'; }
}

async function cargarStock(){
  const r=await fetch(API+'?table=deposito'); const j=await r.json(); const dep=j.data||[];
  const gas=dep.filter(d=>['11','13','45'].includes(String(d.producto_id)));
  const tubo43=dep.find(d=>String(d.producto_id)==='43.5');
  const otros=dep.filter(d=>!['11','13','43.5','45'].includes(String(d.producto_id)));
  
  // TAB GAS
  let hGas='<table><tr style="background:#0f172a"><th>ID</th><th>Nombre</th><th>Llenas</th><th>Vacias</th><th>Cambio</th><th>Acc</th></tr>';
  gas.forEach(d=>{ hGas+=`<tr><td>${d.producto_id}</td><td>${d.nombre||''}</td><td style="color:#22c55e;font-weight:900">${d.llenas||0}</td><td>${d.vacias||0}</td><td>${d.cambio||0}</td><td><button onclick="abrirEditarStock('${d.producto_id}')" style="background:#0ea5e9;color:white;padding:4px 8px;border:none;border-radius:6px">Editar</button></td></tr>`; });
  hGas+='</table>';
  document.getElementById('stockContentGas').innerHTML=hGas;

  // TAB 43.5
  if(tubo43){
    const kilos=parseFloat(tubo43.kilos_en_uso)||0; const porc=Math.max(5,(kilos/43.5*100)).toFixed(0); const color=kilos>20?'#22c55e':kilos>5?'#f59e0b':'#ef4444';
    document.getElementById('stockContent43').innerHTML=`<div style="background:#0f172a;padding:16px;border-radius:12px;border:3px solid ${color}"><b style="color:${color};font-size:18px">🔥 TUBO 43.5 MADRE: ${kilos.toFixed(1)} / 43.5 kg (${porc}%)</b><div style="background:#334155;height:24px;border-radius:12px;margin-top:12px"><div style="width:${porc}%;height:100%;background:${color};border-radius:12px"></div></div><div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px"><div>Llenas: ${tubo43.llenas||0}</div><div>Vacias: ${tubo43.vacias||0}</div></div><button onclick="iniciarNuevoTubo43()" style="width:100%;margin-top:12px;padding:12px;background:${color};color:#000;font-weight:900;border:none;border-radius:8px">🔄 Iniciar Nuevo Tubo 43.5kg Lleno</button></div>`;
  } else {
    document.getElementById('stockContent43').innerHTML='<div class="card" style="border-color:#ef4444">No hay tubo 43.5 - Crealo en Ingreso</div>';
  }

  // TAB OTROS
  let hOtros='<table><tr style="background:#0f172a"><th>ID</th><th>Nombre</th><th>Stock</th><th>Acc</th></tr>';
  otros.forEach(o=>{ hOtros+=`<tr><td>${o.producto_id}</td><td>${o.nombre||''}</td><td>${o.llenas||0}</td><td><button onclick="abrirEditarStock('${o.producto_id}')" style="background:#0ea5e9;color:white;padding:4px 8px;border:none;border-radius:6px">Editar</button></td></tr>`; });
  hOtros+='</table>';
  document.getElementById('stockContentOtros').innerHTML=hOtros;
}

async function guardarIngresoGas(){
  const prod=document.getElementById('ingProducto').value;
  const llenas=parseInt(document.getElementById('ingLlenas').value)||0;
  const vacias=parseInt(document.getElementById('ingVacias').value)||0;
  const remito=document.getElementById('ingRemito').value;
  await fetch(API+'?table=deposito',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accion:'ingreso_gas', producto_id:prod, llenas, vacias, remito})});
  alert('Ingreso guardado'); cargarStock(); cambiarTabStock('gas');
}

async function cargarFinanzas(){ /* tu lógica */ }
function initGpsMaps(){ /* tu lógica */ }
function cargarGpsVivo(){ /* tu lógica */ }

</script>
</body>
</html>
